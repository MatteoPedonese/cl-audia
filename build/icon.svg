<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18245a"/>
      <stop offset="1" stop-color="#070b1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bub" gradientUnits="userSpaceOnUse" x1="512" y1="214" x2="512" y2="830">
      <stop offset="0" stop-color="#8dbcff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="co" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa07f"/>
      <stop offset="1" stop-color="#ef5a36"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000820" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- fumetto con coda in basso a sinistra -->
  <g filter="url(#sh)" fill="url(#bub)">
    <rect x="190" y="214" width="644" height="476" rx="150"/>
    <path d="M292 668 L252 830 L452 676 Z"/>
  </g>

  <!-- forma d'onda ordinata dentro il fumetto -->
  <g fill="#0a0f24" fill-opacity="0.92">
    <rect x="308" y="382" width="56" height="140" rx="28"/>
    <rect x="396" y="327" width="56" height="250" rx="28"/>
    <rect x="484" y="287" width="56" height="330" rx="28"/>
    <rect x="572" y="327" width="56" height="250" rx="28"/>
    <rect x="660" y="382" width="56" height="140" rx="28"/>
  </g>

  <!-- spunta corallo: "tutto in ordine" -->
  <g filter="url(#sh)">
    <circle cx="770" cy="732" r="150" fill="#0b1230"/>
    <circle cx="770" cy="732" r="124" fill="url(#co)"/>
    <path d="M708 736 L753 782 L836 684" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
